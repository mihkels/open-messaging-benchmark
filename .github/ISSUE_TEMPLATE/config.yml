  - name: Security vulnerability
    url: https://github.com/mihkels/open-messaging-benchmark/security/advisories/new
    about: Report vulnerabilities privately. Do not open a public issue.
  - name: Documentation site
    url: https://mihkels.github.io/open-messaging-benchmark/
    about: Guides and reference for running benchmarks and writing drivers.
