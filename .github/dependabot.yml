version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Pulsar 5's shaded client clashes with pulsar-jms-all in the shared JMS driver process (#325)
      - dependency-name: org.apache.pulsar:pulsar-client-all
        update-types: ['version-update:semver-major']
      # NATS Streaming is deprecated upstream (support ended June 2023); keep the driver frozen (#332)
      - dependency-name: io.nats:java-nats-streaming
      # java-nats-streaming gencode targets protobuf 3.x; legacy driver pins stay on the 3.25 line (#538)
      - dependency-name: com.google.protobuf:protobuf-java
        update-types: ['version-update:semver-major']
      - dependency-name: com.google.protobuf:protobuf-java-util
        update-types: ['version-update:semver-major']
      # jetty.version follows the Jetty that Javalin is built against; bump it with Javalin (#559)
      - dependency-name: org.eclipse.jetty:jetty-alpn-java-server
      - dependency-name: org.eclipse.jetty.http2:jetty-http2-server
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directories:
      - /docker
      - /e2e-tests/compose/runner
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns:
          - '*'
    ignore:
      # Floating maven:3-eclipse-temurin-NN tag parses as version 3 and can drop the JDK below 27 (#385)
      - dependency-name: maven
        versions: ['3']
    commit-message:
      prefix: deps

  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs-tooling:
        patterns:
          - '*'
    commit-message:
      prefix: docs
