version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directories:
      - /docker
      - /e2e-tests/compose/runner
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns:
          - '*'
    commit-message:
      prefix: deps
