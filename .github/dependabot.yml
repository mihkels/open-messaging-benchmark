version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Pulsar 5's shaded client clashes with pulsar-jms-all in the shared JMS driver process (#325)
      - dependency-name: org.apache.pulsar:pulsar-client-all
        update-types: ['version-update:semver-major']
      # NATS Streaming is deprecated upstream (support ended June 2023); keep the driver frozen (#332)
      - dependency-name: io.nats:java-nats-streaming
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directories:
      - /docker
      - /e2e-tests/compose/runner
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns:
          - '*'
    ignore:
      # Floating maven:3-eclipse-temurin-NN tag parses as version 3 and can drop the JDK below 27 (#385)
      - dependency-name: maven
        versions: ['3']
    commit-message:
      prefix: deps

  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs-tooling:
        patterns:
          - '*'
    commit-message:
      prefix: docs
