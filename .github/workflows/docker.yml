name: Docker image

# Builds the distribution once, checks and scans the image on every pull request, and publishes
# signed multi-arch images to Docker Hub from main (edge) and release tags (semver, latest).
# Release tags also attach the distribution tarball and SHA256SUMS to the GitHub release as soon as
# the distribution is built (the image scan does not gate it); only the latest release keeps them.
# Pull requests never see registry credentials: only the publish job uses the dockerhub
# environment, and it runs for pushes to main and v* tags only. Only pushes to main write caches
# (pull request caches are scoped to their own ref) and release tags use none, so nothing a pull
# request writes can end up in a published image.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'bin/**'
      - 'benchmark-framework/**'
      - 'driver-*/**'
      - 'package/**'
      - 'docker/**'
      - 'docker-bake.hcl'
      - '.dockerignore'
      - 'pom.xml'
      - 'mise.toml'
      - '.github/workflows/docker.yml'
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPOSITORY: docker.io/mihkels/open-messaging-benchmark
  TRIVY_VERSION: 0.76.1
  COSIGN_VERSION: 3.1.4

jobs:
  dist:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      variants: ${{ steps.variants.outputs.variants }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check versions
        run: .github/scripts/check-versions.sh

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: java http:maven
          cache: false

      # Release tags resolve dependencies fresh; main and pull requests restore the Maven
      # repository that pushes to main save in "Build and test"
      - name: Restore Maven repository
        if: github.ref_type != 'tag'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      # Release tags run the full verification; main and pull requests are verified by the
      # "Build and test" workflow, so here only the distribution is packaged.
      - name: Package
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            mvn --no-transfer-progress --batch-mode verify
          else
            mvn --no-transfer-progress --batch-mode -DskipTests -Dlicense.skip -Dspotless.check.skip \
              -Dcheckstyle.skip -Dspotbugs.skip -Djacoco.skip package
          fi
          mkdir dist
          cp package/target/openmessaging-benchmark-*-bin.tar.gz dist/dist.tar.gz

      - name: Image variants
        id: variants
        run: |
          variants=$(grep -v -E '^[[:space:]]*(#|$)' docker/drivers.txt | jq -R . | jq -cs '["all"] + .')
          echo "variants=$variants" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/dist.tar.gz
          retention-days: 1
          if-no-files-found: error

  check:
    name: Check image
    needs: dist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Upload of the vulnerability scan to code scanning (pushes only)
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build images
        run: |
          IMAGE=omb-check:all docker buildx bake check
          DRIVERS=kafka IMAGE=omb-check:kafka docker buildx bake check

      - name: Smoke test
        run: |
          set -euo pipefail
          for image in omb-check:all omb-check:kafka; do
            test "$(docker run --rm "$image" id -u)" = 10001
            docker run --rm --read-only --tmpfs /tmp --tmpfs /results "$image" benchmark --help > /dev/null
            docker run --rm --read-only --tmpfs /tmp --tmpfs /results "$image" benchmark-worker --help > /dev/null
            if docker run --rm "$image" touch /benchmark/write-test 2> /dev/null; then
              echo "/benchmark must not be writable in $image" >&2
              exit 1
            fi
          done
          test "$(docker run --rm omb-check:kafka ls drivers)" = driver-kafka
          test "$(docker run --rm omb-check:all ls drivers | wc -l)" -eq "$(grep -c -v -E '^[[:space:]]*(#|$)' docker/drivers.txt)"

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: false
          cache: false

      # Every finding, including the client libraries bundled with driver plugins, goes to code
      # scanning. The build fails on fixable critical and high findings in the layers this
      # repository controls: the base image packages and the benchmark framework in /benchmark/lib.
      # Driver client libraries follow their broker's client releases and are upgraded through
      # Dependabot pull requests instead.
      - name: Scan for vulnerabilities
        env:
          # Avoids GitHub API rate limits when mise downloads the tool
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise exec "trivy@$TRIVY_VERSION" -- trivy image --scanners vuln --ignore-unfixed \
            --format sarif --output trivy.sarif omb-check:all
          mise exec "trivy@$TRIVY_VERSION" -- trivy image --scanners vuln --ignore-unfixed \
            --severity CRITICAL,HIGH --skip-dirs /benchmark/drivers --exit-code 1 omb-check:all

      - name: Upload scan results
        if: always() && github.event_name == 'push' && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-image

  publish:
    name: Publish ${{ matrix.variant }}
    if: github.event_name == 'push'
    needs:
      - dist
      - check
    runs-on: ubuntu-latest
    environment: dockerhub
    permissions:
      contents: read
      # Keyless cosign signing through GitHub's OIDC token
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        variant: ${{ fromJSON(needs.dist.outputs.variants) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          flavor: |
            latest=auto
            suffix=${{ matrix.variant != 'all' && format('-{0}', matrix.variant) || '' }},onlatest=true
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: release
          push: true
          set: |
            release.args.DRIVERS=${{ matrix.variant }}
            release.args.VERSION=${{ steps.meta.outputs.version }}
            release.args.REVISION=${{ github.sha }}

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: false
          cache: false

      - name: Sign image
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          digest=$(jq -r '.release["containerimage.digest"]' <<< "$METADATA")
          [[ "$digest" == sha256:* ]] || { echo "no image digest in bake metadata" >&2; exit 1; }
          mise exec "cosign@$COSIGN_VERSION" -- cosign sign --yes "$IMAGE_REPOSITORY@$digest"
          echo "Signed $IMAGE_REPOSITORY@$digest" >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: Attach distribution to release
    if: github.ref_type == 'tag'
    # The tarball is verified by `mvn verify` on tags; the image scan covers base image packages that
    # are not part of it, so a scan finding blocks the images but not the distribution
    needs: dist
    runs-on: ubuntu-latest
    permissions:
      # Upload release assets and remove them from releases past the retention window
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # release-please creates the release together with the tag, so it already exists here
      - name: Upload distribution
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tarball="openmessaging-benchmark-${TAG#v}-bin.tar.gz"
          cd dist
          mv dist.tar.gz "$tarball"
          sha256sum "$tarball" > SHA256SUMS
          gh release upload "$TAG" "$tarball" SHA256SUMS --clobber
          echo "Attached $tarball and SHA256SUMS to release $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the distribution on the latest release only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/prune-release-assets.sh
