name: Framework performance

on:
  workflow_dispatch:
    inputs:
      topology:
        description: Framework topology (distributed measures independent streams/control plane)
        type: choice
        options: [process, http, local, distributed]
        default: process
      mode:
        description: Synthetic loopback completion
        type: choice
        options: [sync, async]
        default: sync
      rate:
        description: Fixed offered messages per second
        default: "10000"
        required: true
      collector:
        description: Opt-in collector experiment (not a production recommendation)
        type: choice
        options: [g1, parallel, zgc]
        default: g1
      profile:
        description: Record JFR and GC logs (compare only with equally profiled runs)
        type: boolean
        default: false

permissions:
  contents: read

# Queues repeat dispatches on the same ref instead of running them side by side
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: java http:maven python
          # Restores the caches main writes in "Build and test" without writing its own
          cache_save: false
          cache_key_prefix: mise-v1-jvm
      - name: Restore Maven repository
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Build opt-in tooling
        run: mvn --no-transfer-progress --batch-mode -Pperformance -pl performance-harness -am install -DskipTests
      - name: Run resource experiment
        env:
          TOPOLOGY: ${{ inputs.topology }}
          MODE: ${{ inputs.mode }}
          RATE: ${{ inputs.rate }}
          COLLECTOR: ${{ inputs.collector }}
          PROFILE: ${{ inputs.profile }}
        run: |
          options=()
          if [ "$PROFILE" = "true" ]; then options+=(--profile); fi
          bin/framework-performance run --output "$RUNNER_TEMP/framework-performance" \
            --topology "$TOPOLOGY" --mode "$MODE" --rate "$RATE" --collector "$COLLECTOR" \
            --processors 2 --repetitions 3 "${options[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: framework-performance-${{ inputs.collector }}
          path: ${{ runner.temp }}/framework-performance
