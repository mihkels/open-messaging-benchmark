name: Build and test

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install project tools
        uses: jdx/mise-action@v5

      - name: Build and Verify
        run: mvn --no-transfer-progress --batch-mode verify

      - name: package surefire test results
        if: failure()
        run: |
          rm -rf test-results
          mkdir test-results
          find . -type d -name "*surefire*" -exec cp --parents -R {} test-results/ \;
          zip -r test-results.zip test-results
      - uses: actions/upload-artifact@v7
        name: upload test-results
        if: failure()
        with:
          name: test-results
          path: test-results.zip

  framework-performance-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - name: Build and verify opt-in harness
        run: mvn --no-transfer-progress --batch-mode -Pperformance -pl performance-harness -am install
      - name: Check comparison and sampling logic
        run: python3 -m unittest discover -s performance-harness/tests -v
      - name: Smoke JMH wiring without a performance threshold
        run: |
          bin/framework-performance micro --output "$RUNNER_TEMP/framework-smoke/jmh" -- \
            '.*StatsTransferBenchmark.aggregatePeriod' -p aggregationSize=1 \
            -wi 1 -i 1 -w 100ms -r 100ms -f 1
      - name: Exercise framework topologies without a broker
        run: |
          for topology in local process http distributed; do
            bin/framework-performance run --smoke --topology "$topology" \
              --output "$RUNNER_TEMP/framework-smoke/$topology" \
              --processors 2 --rate 1000 --repetitions 1
          done
          bin/framework-performance run --smoke --topology process --mode async \
            --output "$RUNNER_TEMP/framework-smoke/async" \
            --processors 2 --rate 1000 --repetitions 1
      - name: Check failed driver startup is reported
        run: |
          if bin/framework-performance run --smoke --topology process \
            --output "$RUNNER_TEMP/framework-smoke/failed-startup" --repetitions 1 \
            --driver-jvm-opts=-XX:UnsupportedOMBOption; then
            echo "Invalid JVM options unexpectedly succeeded"
            exit 1
          fi
          test -f "$RUNNER_TEMP/framework-smoke/failed-startup/run-001/failure.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: framework-performance-smoke
          path: ${{ runner.temp }}/framework-smoke
