name: Build and test

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests run the framework performance smoke only when framework code changes
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      framework: ${{ steps.filter.outputs.framework }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            framework:
              - 'benchmark-framework/**'
              - 'driver-api/**'
              - 'performance-harness/**'
              - 'bin/framework-performance'
              - 'pom.xml'
              - '.github/workflows/pr-build-and-test.yml'

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check versions
        run: .github/scripts/check-versions.sh
      - name: Install project tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: java http:maven python
          # Only pushes to main write caches; pull requests restore them read-only
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache_key_prefix: mise-v1-jvm

      # Every Maven job restores this cache; only this job, which resolves the most dependencies,
      # saves it from main
      - name: Restore Maven repository
        id: maven-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      # Fails when a module's coverage drops below its jacoco.min.* floor
      - name: Build and Verify
        run: mvn --no-transfer-progress --batch-mode verify

      # Fork pull requests get no secrets, so SonarCloud is skipped there (and until SONAR_TOKEN is set)
      - name: Check SonarCloud token
        id: sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then present=true; else present=false; fi
          echo "present=$present" >> "$GITHUB_OUTPUT"

      # Analyses the build above, reusing its classes and JaCoCo XML reports
      - name: SonarCloud analysis
        if: steps.sonar-token.outputs.present == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          mvn --no-transfer-progress --batch-mode
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: Save Maven repository
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        name: upload coverage reports
        with:
          name: jacoco-csv
          path: '*/target/site/jacoco/jacoco.csv'
          if-no-files-found: error
          retention-days: 7

      - name: package surefire test results
        if: failure()
        run: |
          rm -rf test-results
          mkdir test-results
          find . -type d -name "*surefire*" -exec cp --parents -R {} test-results/ \;
          zip -r test-results.zip test-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        name: upload test-results
        if: failure()
        with:
          name: test-results
          path: test-results.zip

  coverage-badge:
    # Publishes the overall coverage badges shown in README.md to the orphan `badges` branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jacoco-csv
          path: coverage
      - name: Generate badges
        uses: cicirello/jacoco-badge-generator@72266185b7ee48a6fd74eaf0238395cc8b14fef8 # v2.12.1
        with:
          jacoco-csv-file: "coverage/**/jacoco.csv"
          badges-directory: badges
          generate-branches-badge: true
          generate-workflow-summary: true
      - name: Push badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The generator runs in a container and leaves root-owned files; publish from a copy
          mkdir publish
          cp badges/*.svg publish/
          cd publish
          git init -q -b badges
          git add ./*.svg
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Update coverage badges for ${GITHUB_SHA}"
          git push --force -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  framework-performance-smoke:
    # Always runs on pushes to main; `changes` is skipped there, so the condition must tolerate that
    needs: changes
    if: >-
      !cancelled()
      && (github.event_name == 'push' || needs.changes.outputs.framework == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: java http:maven python
          # The build job writes this cache
          cache_save: false
          cache_key_prefix: mise-v1-jvm
      - name: Restore Maven repository
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      # The build job already tested and analysed the upstream modules, so only install their jars
      - name: Install upstream modules
        run: >-
          mvn --no-transfer-progress --batch-mode -pl driver-api,benchmark-framework -am install
          -Dmaven.test.skip=true -Djacoco.skip -Derrorprone.skip -Dcheckstyle.skip -Dspotbugs.skip
          -Dspotless.check.skip -Dlicense.skip
      # The build job never builds this module, so it keeps its tests, coverage check and Error Prone
      - name: Build and verify opt-in harness
        run: mvn --no-transfer-progress --batch-mode -Pperformance -pl performance-harness install
      - name: Check comparison and sampling logic
        run: python3 -m unittest discover -s performance-harness/tests -v
      - name: Smoke JMH wiring without a performance threshold
        run: |
          bin/framework-performance micro --output "$RUNNER_TEMP/framework-smoke/jmh" -- \
            '.*StatsTransferBenchmark.aggregatePeriod' -p aggregationSize=1 \
            -wi 1 -i 1 -w 100ms -r 100ms -f 1
      - name: Exercise framework topologies without a broker
        run: |
          for topology in local process http distributed; do
            bin/framework-performance run --smoke --topology "$topology" \
              --output "$RUNNER_TEMP/framework-smoke/$topology" \
              --processors 2 --rate 1000 --repetitions 1
          done
          bin/framework-performance run --smoke --topology process --mode async \
            --output "$RUNNER_TEMP/framework-smoke/async" \
            --processors 2 --rate 1000 --repetitions 1
      - name: Check failed driver startup is reported
        run: |
          if bin/framework-performance run --smoke --topology process \
            --output "$RUNNER_TEMP/framework-smoke/failed-startup" --repetitions 1 \
            --driver-jvm-opts=-XX:UnsupportedOMBOption; then
            echo "Invalid JVM options unexpectedly succeeded"
            exit 1
          fi
          test -f "$RUNNER_TEMP/framework-smoke/failed-startup/run-001/failure.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: framework-performance-smoke
          path: ${{ runner.temp }}/framework-smoke
