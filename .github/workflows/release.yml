name: Release

# release-please keeps a Release PR open that bumps pom.xml, version.txt, the example plugin and
# the Helm chart (version and appVersion) together and updates CHANGELOG.md from conventional
# commits. Merging it creates the vX.Y.Z tag and GitHub release; the tag triggers the Docker image
# (which also attaches the distribution tarball to the release) and Helm chart publishing workflows.
#
# A GitHub App token is used because pull requests and tags created with GITHUB_TOKEN do not
# trigger other workflows, so the Release PR would get no CI and the tag would publish nothing.

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # The App ID works here as well as the Client ID; both identify the app in the token request
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
