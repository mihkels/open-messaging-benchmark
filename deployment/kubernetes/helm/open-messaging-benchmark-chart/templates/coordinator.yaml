{{- $mode := .Values.coordinator.mode }}
{{- if not (has $mode (list "interactive" "job")) }}
{{- fail "coordinator.mode must be interactive or job" }}
{{- end }}
{{- define "omb.coordinatorPod" -}}
metadata:
  labels:
    {{- include "omb.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
  {{- with .Values.coordinator.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  serviceAccountName: {{ include "omb.serviceAccountName" . }}
  automountServiceAccountToken: false
  {{- if eq .Values.coordinator.mode "job" }}
  restartPolicy: Never
  {{- end }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  initContainers:
    {{- include "omb.waitForWorkers" . | nindent 4 }}
  containers:
    - name: coordinator
      image: {{ include "omb.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      env:
        - name: WORKERS
          value: {{ include "omb.workers" . | quote }}
        - name: DRIVER
          value: {{ include "omb.driverPath" . | quote }}
        - name: WORKLOAD
          value: {{ include "omb.workloadPath" . | quote }}
        - name: SUPERVISOR_HEAP_OPTS
          value: {{ .Values.coordinator.heapOpts | quote }}
        {{- with include "omb.authEnv" . }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with .Values.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      command: ["bash", "-c"]
      {{- if eq .Values.coordinator.mode "job" }}
      args:
        - |
          set -euo pipefail
          benchmark --drivers "$DRIVER" --workers "$WORKERS" -o /results/result.json "$@" "$WORKLOAD"
          echo "----- OMB RESULT BEGIN -----"
          cat /results/result.json
          echo
          echo "----- OMB RESULT END -----"
        - benchmark
        {{- range .Values.coordinator.extraArgs }}
        - {{ . | quote }}
        {{- end }}
      {{- else }}
      args:
        - |
          echo "Start a run with:"
          echo '  benchmark --drivers "$DRIVER" --workers "$WORKERS" -o /results/result.json "$WORKLOAD"'
          exec sleep infinity
      {{- end }}
      resources:
        {{- toYaml .Values.coordinator.resources | nindent 8 }}
      volumeMounts:
        {{- include "omb.volumeMounts" . | nindent 8 }}
  volumes:
    {{- include "omb.volumes" . | nindent 4 }}
  {{- with .Values.coordinator.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.coordinator.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.coordinator.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if eq $mode "job" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "omb.coordinatorName" . }}
  labels:
    {{- include "omb.labels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
spec:
  backoffLimit: {{ .Values.coordinator.job.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.coordinator.job.ttlSecondsAfterFinished }}
  {{- with .Values.coordinator.job.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  template:
    {{- include "omb.coordinatorPod" . | nindent 4 }}
{{- else }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omb.coordinatorName" . }}
  labels:
    {{- include "omb.labels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "omb.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: coordinator
  template:
    {{- include "omb.coordinatorPod" . | nindent 4 }}
{{- end }}
