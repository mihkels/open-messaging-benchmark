{{- if .Values.grafana.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omb.fullname" . }}-dashboard
  labels:
    {{- include "omb.labels" . | nindent 4 }}
    # Picked up by the Grafana dashboard sidecar, for example in kube-prometheus-stack
    grafana_dashboard: "1"
data:
  omb.json: |-
    {{- .Files.Get "dashboards/omb.json" | nindent 4 }}
{{- end }}
