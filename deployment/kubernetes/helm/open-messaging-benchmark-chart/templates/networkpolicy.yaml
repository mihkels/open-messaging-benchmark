{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "omb.workerName" . }}
  labels:
    {{- include "omb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "omb.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "omb.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: coordinator
      ports:
        - port: 8080
          protocol: TCP
    {{- with .Values.networkPolicy.metricsFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: 8080
          protocol: TCP
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "omb.coordinatorName" . }}
  labels:
    {{- include "omb.labels" . | nindent 4 }}
spec:
  # The coordinator only makes outgoing calls
  podSelector:
    matchLabels:
      {{- include "omb.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: coordinator
  policyTypes:
    - Ingress
{{- end }}
