{{- if and .Values.workers.auth.enabled (not .Values.workers.auth.existingSecret) }}
{{- $name := include "omb.authSecretName" . }}
{{- $key := include "omb.authSecretKey" . }}
{{- $token := "" }}
{{- if .Values.workers.auth.token }}
{{- $token = .Values.workers.auth.token | b64enc }}
{{- else }}
{{- /* Reuse the token of an earlier install, so upgrades do not lock out running pods */}}
{{- $token = randAlphaNum 48 | b64enc }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data }}
{{- if hasKey $existing.data $key }}
{{- $token = index $existing.data $key }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "omb.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
type: Opaque
data:
  {{ $key }}: {{ $token }}
{{- end }}
