{{- if and .Values.workers.tls.enabled (not .Values.workers.tls.existingSecret) }}
{{- $name := include "omb.tlsSecretName" . }}
{{- /* Reuse the certificate of an earlier install, so upgrades keep workers and coordinator in step */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $crt := "" }}
{{- $key := "" }}
{{- if and $existing $existing.data (hasKey $existing.data "tls.crt") (hasKey $existing.data "tls.key") }}
{{- $crt = index $existing.data "tls.crt" }}
{{- $key = index $existing.data "tls.key" }}
{{- else }}
{{- $cert := genSelfSignedCert "omb-worker" nil (list "omb-worker") 825 }}
{{- $crt = $cert.Cert | b64enc }}
{{- $key = $cert.Key | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "omb.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
{{- end }}
