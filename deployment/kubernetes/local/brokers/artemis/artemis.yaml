# Headless Service with publishNotReadyAddresses: the name resolves straight to the pod IP, like a
# compose service name.
apiVersion: v1
kind: Service
metadata:
  name: artemis
  labels:
    app.kubernetes.io/name: artemis
    app.kubernetes.io/part-of: omb-broker
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: artemis
  ports:
    - name: core
      port: 61616
    - name: console
      port: 8161
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artemis
  labels:
    app.kubernetes.io/name: artemis
    app.kubernetes.io/part-of: omb-broker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: artemis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: artemis
        app.kubernetes.io/part-of: omb-broker
    spec:
      hostname: artemis
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: artemis
          image: apache/artemis:2.57.0@sha256:0f32b054e1f4adc45fc64824ebb0586579ffd563ce37d75b5a10d27db19a3889
          env:
            - name: ANONYMOUS_LOGIN
              value: "true"
            - name: JAVA_ARGS_APPEND
              value: "-Xmx768m"
          ports:
            - name: core
              containerPort: 61616
            - name: console
              containerPort: 8161
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - /var/lib/artemis-instance/bin/artemis check node --silent --user artemis --password artemis > /dev/null 2>&1
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1280Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The image creates the broker instance here on first start (a VOLUME in the image).
            - name: instance
              mountPath: /var/lib/artemis-instance
      volumes:
        - name: instance
          emptyDir: {}
