# Headless Service with publishNotReadyAddresses: the name resolves straight to the pod IP, like a
# compose service name (the bookie registers itself as bookie:3181).
apiVersion: v1
kind: Service
metadata:
  name: bookie
  labels:
    app.kubernetes.io/name: bookie
    app.kubernetes.io/part-of: omb-broker
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: bookie
  ports:
    - name: bookie
      port: 3181
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookie
  labels:
    app.kubernetes.io/name: bookie
    app.kubernetes.io/part-of: omb-broker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bookie
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookie
        app.kubernetes.io/part-of: omb-broker
    spec:
      hostname: bookie
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The image runs as uid 10000 with gid 0; apply-config-from-env.py rewrites the group-writable conf/.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # compose starts the bookie after bookkeeper-init; wait until the cluster metadata exists.
        - name: wait-for-bookkeeper-init
          image: apachepulsar/pulsar:4.0.6@sha256:c30ad1646e00b2a7c9e89de949a91b6506afc5f1bd3f402a23eefc46990def88
          command:
            - bash
            - -c
            - |
              until bin/pulsar zookeeper-shell -server zookeeper:2181 get /ledgers/INSTANCEID 2>/dev/null | grep -Eq '^[0-9a-f]{8}-'; do
                echo waiting for bookkeeper-init; sleep 3
              done
          env:
            - name: PULSAR_MEM
              value: "-Xmx128m"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: bookie
          image: apachepulsar/pulsar:4.0.6@sha256:c30ad1646e00b2a7c9e89de949a91b6506afc5f1bd3f402a23eefc46990def88
          command:
            - sh
            - -c
            - >-
              bin/apply-config-from-env.py conf/bookkeeper.conf &&
              exec bin/bookkeeper bookie
          env:
            - name: BOOKIE_MEM
              value: "-Xms256m -Xmx512m -XX:MaxDirectMemorySize=512m"
            - name: metadataServiceUri
              value: zk+hierarchical://zookeeper:2181/ledgers
            - name: zkServers
              value: zookeeper:2181
            - name: advertisedAddress
              value: bookie
            - name: bookiePort
              value: "3181"
            - name: httpServerEnabled
              value: "true"
            - name: httpServerPort
              value: "8000"
            - name: journalDirectories
              value: /tmp/bk-journal
            - name: ledgerDirectories
              value: /tmp/bk-ledgers
            - name: dbStorage_writeCacheMaxSizeMb
              value: "64"
            - name: dbStorage_readAheadCacheMaxSizeMb
              value: "64"
            - name: dbStorage_rocksDB_blockCacheSize
              value: "16777216"
          ports:
            - name: bookie
              containerPort: 3181
            - name: http
              containerPort: 8000
          readinessProbe:
            exec:
              command: ["sh", "-c", "curl -fsS http://localhost:8000/api/v1/bookie/state | grep -q '\"running\" : true'"]
            periodSeconds: 3
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
