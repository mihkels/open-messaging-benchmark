# Binds the DistributedLog namespace with the driver plugin's own shaded DistributedLog tool from the
# benchmark image ("omb-image" is replaced by the caller through a kustomize images override).
# Waits for the bookie itself, so it can be applied together with everything else.
apiVersion: batch/v1
kind: Job
metadata:
  name: dlog-init
  labels:
    app.kubernetes.io/name: dlog-init
    app.kubernetes.io/part-of: omb-broker-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dlog-init
        app.kubernetes.io/part-of: omb-broker-init
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dlog-init
          image: omb-image
          workingDir: /benchmark
          command:
            - bash
            - -c
            - |
              # The benchmark image has no curl; poll the bookie HTTP API with bash /dev/tcp.
              bookie_running() {
                ( exec 3<>/dev/tcp/bookie/8000 || exit 1
                  printf 'GET /api/v1/bookie/state HTTP/1.0\r\nHost: bookie\r\n\r\n' >&3
                  timeout 10 cat <&3 ) 2>/dev/null | grep -q '"running" : true'
              }
              until bookie_running; do echo waiting for bookie; sleep 3; done
              exec java -cp '/benchmark/drivers/driver-bookkeeper/lib/*' \
                dlshade.org.apache.distributedlog.tools.Tool \
                dlshade.org.apache.distributedlog.admin.DistributedLogAdmin \
                bind -l /ledgers -s zookeeper:2181 -c distributedlog://zookeeper:2181/streams
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
