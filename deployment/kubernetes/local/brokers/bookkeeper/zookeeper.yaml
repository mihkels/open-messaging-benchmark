# Headless Service with publishNotReadyAddresses: the name resolves straight to the pod IP, like a
# compose service name.
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/part-of: omb-broker
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: zookeeper
  ports:
    - name: client
      port: 2181
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/part-of: omb-broker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zookeeper
        app.kubernetes.io/part-of: omb-broker
    spec:
      hostname: zookeeper
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The image runs as uid 10000 with gid 0; apply-config-from-env.py rewrites the group-writable conf/.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zookeeper
          image: apachepulsar/pulsar:4.0.6@sha256:c30ad1646e00b2a7c9e89de949a91b6506afc5f1bd3f402a23eefc46990def88
          command: ["sh", "-c", "bin/apply-config-from-env.py conf/zookeeper.conf && exec bin/pulsar zookeeper"]
          env:
            - name: PULSAR_MEM
              value: "-Xmx256m"
          ports:
            - name: client
              containerPort: 2181
          readinessProbe:
            exec:
              command: ["bin/pulsar-zookeeper-ruok.sh"]
            periodSeconds: 3
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /pulsar/data
      volumes:
        - name: data
          emptyDir: {}
