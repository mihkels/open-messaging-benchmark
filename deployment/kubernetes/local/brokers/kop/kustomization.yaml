# Apache Pulsar 2.10.4 standalone with the StreamNative Kafka-on-Pulsar 2.10.4.6 protocol handler
# (port of e2e-tests/compose/stacks/kop.yaml). The Pulsar 2.10.4 image is linux/amd64 only, so the pod
# is pinned to amd64 nodes. The pinned NAR from e2e-tests/compose/artifacts.txt is downloaded and
# verified by an init container.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pulsar-kop.yaml
