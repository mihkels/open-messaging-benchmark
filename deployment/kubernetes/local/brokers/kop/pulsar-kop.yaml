# Headless Service with publishNotReadyAddresses: the name resolves straight to the pod IP, like a
# compose service name.
apiVersion: v1
kind: Service
metadata:
  name: pulsar-kop
  labels:
    app.kubernetes.io/name: pulsar-kop
    app.kubernetes.io/part-of: omb-broker
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: pulsar-kop
  ports:
    - name: pulsar
      port: 6650
    - name: http
      port: 8080
    - name: kafka
      port: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsar-kop
  labels:
    app.kubernetes.io/name: pulsar-kop
    app.kubernetes.io/part-of: omb-broker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pulsar-kop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulsar-kop
        app.kubernetes.io/part-of: omb-broker
    spec:
      hostname: pulsar-kop
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      # The image is linux/amd64 only (no multi-arch index for this tag).
      nodeSelector:
        kubernetes.io/arch: amd64
      # The image runs as uid 10000 with gid 0; apply-config-from-env.py rewrites the group-writable conf/.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Download the pinned KoP protocol handler NAR (artifacts.txt: kop-nar) and verify its sha256.
        - name: fetch-kop-nar
          image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
          command:
            - sh
            - -c
            - |
              set -e
              url=https://github.com/streamnative/kop/releases/download/v2.10.4.6/pulsar-protocol-handler-kafka-2.10.4.6.nar
              sha=2e03d879181b718898809b7b759231cfde03ba5a693405bb8211dd4b89f3849f
              file=/protocols/$(basename "$url")
              curl -fsSL --retry 3 -o "$file.tmp" "$url"
              if ! echo "$sha  $file.tmp" | sha256sum -c -; then
                echo "Checksum mismatch for $url" >&2
                rm -f "$file.tmp"
                exit 1
              fi
              mv "$file.tmp" "$file"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: protocols
              mountPath: /protocols
      containers:
        - name: pulsar-kop
          image: apachepulsar/pulsar:2.10.4@sha256:8b76d49401d3fe398be3cde395fb164ad8722b64691e31c44991f32746ca8119
          command: ["sh", "-c", "bin/apply-config-from-env.py conf/standalone.conf && exec bin/pulsar standalone -nfw -nss"]
          env:
            - name: PULSAR_MEM
              value: "-Xms256m -Xmx1g -XX:MaxDirectMemorySize=512m"
            # compose sets hostname: pulsar-kop; topic lookups must return the service name.
            - name: PULSAR_PREFIX_advertisedAddress
              value: pulsar-kop
            - name: PULSAR_PREFIX_messagingProtocols
              value: kafka
            - name: PULSAR_PREFIX_protocolHandlerDirectory
              value: /pulsar/protocols
            - name: PULSAR_PREFIX_allowAutoTopicCreationType
              value: partitioned
            - name: PULSAR_PREFIX_kafkaListeners
              value: PLAINTEXT://0.0.0.0:9092
            - name: PULSAR_PREFIX_kafkaAdvertisedListeners
              value: PLAINTEXT://pulsar-kop:9092
            - name: PULSAR_PREFIX_brokerEntryMetadataInterceptors
              value: org.apache.pulsar.common.intercept.AppendIndexMetadataInterceptor
            - name: PULSAR_PREFIX_brokerDeleteInactiveTopicsEnabled
              value: "false"
            # Kafka clients use idempotent producers by default, which KoP serves through its
            # transaction coordinator.
            - name: PULSAR_PREFIX_kafkaTransactionCoordinatorEnabled
              value: "true"
            - name: PULSAR_PREFIX_brokerDeduplicationEnabled
              value: "true"
          ports:
            - name: pulsar
              containerPort: 6650
            - name: http
              containerPort: 8080
            - name: kafka
              containerPort: 9092
          readinessProbe:
            exec:
              command: ["sh", "-c", "curl -fsS http://localhost:8080/admin/v2/brokers/health > /dev/null && bash -c 'echo > /dev/tcp/localhost/9092'"]
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: protocols
              mountPath: /pulsar/protocols
              readOnly: true
            - name: data
              mountPath: /pulsar/data
      volumes:
        - name: protocols
          emptyDir: {}
        - name: data
          emptyDir: {}
