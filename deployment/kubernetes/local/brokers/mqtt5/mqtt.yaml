# Headless Service with publishNotReadyAddresses: the name resolves straight to the pod IP, like a
# compose service name.
apiVersion: v1
kind: Service
metadata:
  name: mqtt
  labels:
    app.kubernetes.io/name: mqtt
    app.kubernetes.io/part-of: omb-broker
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: mqtt
  ports:
    - name: mqtt
      port: 1883
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt
  labels:
    app.kubernetes.io/name: mqtt
    app.kubernetes.io/part-of: omb-broker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mqtt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mqtt
        app.kubernetes.io/part-of: omb-broker
    spec:
      hostname: mqtt
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The image's mosquitto user (1883); the entrypoint skips its chown step when not root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mqtt
          image: eclipse-mosquitto:2.0.22@sha256:09b62ff32c2e7b64d4b431b9a89236073289b68db273de2b089edeb9b0d92b5c
          command:
            - sh
            - -c
            - |
              printf 'listener 1883 0.0.0.0\nallow_anonymous true\n' > /tmp/mosquitto.conf
              exec mosquitto -c /tmp/mosquitto.conf
          ports:
            - name: mqtt
              containerPort: 1883
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mosquitto_pub -h localhost -t health -m ok -r -q 1 && mosquitto_sub -h localhost -t health -C 1 -W 5
            periodSeconds: 3
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
