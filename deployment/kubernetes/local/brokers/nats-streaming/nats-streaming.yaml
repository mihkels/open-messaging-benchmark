# Headless Service with publishNotReadyAddresses: the name resolves straight to the pod IP, like a
# compose service name.
apiVersion: v1
kind: Service
metadata:
  name: nats-streaming
  labels:
    app.kubernetes.io/name: nats-streaming
    app.kubernetes.io/part-of: omb-broker
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: nats-streaming
  ports:
    - name: client
      port: 4222
    - name: monitor
      port: 8222
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-streaming
  labels:
    app.kubernetes.io/name: nats-streaming
    app.kubernetes.io/part-of: omb-broker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nats-streaming
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats-streaming
        app.kubernetes.io/part-of: omb-broker
    spec:
      hostname: nats-streaming
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Scratch image with a static binary and an in-memory store; it needs no privileges.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats-streaming
          image: nats-streaming:0.25.6@sha256:0ad6861379c936d508e2aad174fb402c170ec0b28c8f634549dea4b09f0451cf
          # The cluster ID must match clusterId in the driver configuration.
          args: ["-cid", "omb-e2e", "-m", "8222", "-store", "memory"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          readinessProbe:
            httpGet:
              path: /streaming/serverz
              port: 8222
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
