# Headless Service with publishNotReadyAddresses: the name resolves straight to the pod IP, like a
# compose service name.
apiVersion: v1
kind: Service
metadata:
  name: nsqlookupd
  labels:
    app.kubernetes.io/name: nsqlookupd
    app.kubernetes.io/part-of: omb-broker
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: nsqlookupd
  ports:
    - name: tcp
      port: 4160
    - name: http
      port: 4161
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nsqlookupd
  labels:
    app.kubernetes.io/name: nsqlookupd
    app.kubernetes.io/part-of: omb-broker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nsqlookupd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nsqlookupd
        app.kubernetes.io/part-of: omb-broker
    spec:
      hostname: nsqlookupd
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The image defaults to root but the NSQ daemons need no privileges; run as nobody.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nsqlookupd
          image: nsqio/nsq:v1.3.0@sha256:1a369c146af71bc95c25d54b375a2b98452478c1eaf4e85f8fcb01da20f2c78a
          command: ["/nsqlookupd"]
          ports:
            - name: tcp
              containerPort: 4160
            - name: http
              containerPort: 4161
          readinessProbe:
            httpGet:
              path: /ping
              port: 4161
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
