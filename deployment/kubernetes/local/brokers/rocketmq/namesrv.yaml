# Headless Service with publishNotReadyAddresses: the name resolves straight to the pod IP, like a
# compose service name.
apiVersion: v1
kind: Service
metadata:
  name: namesrv
  labels:
    app.kubernetes.io/name: namesrv
    app.kubernetes.io/part-of: omb-broker
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: namesrv
  ports:
    - name: remoting
      port: 9876
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: namesrv
  labels:
    app.kubernetes.io/name: namesrv
    app.kubernetes.io/part-of: omb-broker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: namesrv
  template:
    metadata:
      labels:
        app.kubernetes.io/name: namesrv
        app.kubernetes.io/part-of: omb-broker
    spec:
      hostname: namesrv
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 3000
        runAsGroup: 3000
        fsGroup: 3000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: namesrv
          image: apache/rocketmq:5.3.2@sha256:4a80ff5cd4b0a3d3ef6dc338ce2028a85bd995648cb3aa5c3e753746d2dbc587
          args: ["sh", "mqnamesrv"]
          env:
            - name: JAVA_OPT_EXT
              value: "-Xms256m -Xmx512m -Xmn128m"
          ports:
            - name: remoting
              containerPort: 9876
          readinessProbe:
            tcpSocket:
              port: 9876
            periodSeconds: 3
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: logs
              mountPath: /home/rocketmq/logs
      volumes:
        - name: logs
          emptyDir: {}
