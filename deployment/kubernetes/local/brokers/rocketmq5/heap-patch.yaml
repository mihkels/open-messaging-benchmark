# Smaller heaps from rocketmq5-proxy.yaml so that the proxy fits next to the name server and broker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: namesrv
spec:
  template:
    spec:
      containers:
        - name: namesrv
          env:
            - name: JAVA_OPT_EXT
              value: "-Xms64m -Xmx256m -Xmn64m"
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker
spec:
  template:
    spec:
      containers:
        - name: broker
          env:
            - name: JAVA_OPT_EXT
              value: "-Xms128m -Xmx512m -Xmn128m"
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1536Mi
