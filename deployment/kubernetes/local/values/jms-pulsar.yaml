# Chart values for the jms-pulsar stack: downloads the pinned JMS provider jar (URL and sha256 from
# e2e-tests/compose/artifacts.txt) into the driver-jms ext/ directory of every worker.

image:
  variant: jms

extraVolumes:
  - name: jms-ext
    emptyDir: {}

extraVolumeMounts:
  - name: jms-ext
    mountPath: /benchmark/drivers/driver-jms/ext
    readOnly: true

extraInitContainers:
  - name: fetch-jms-provider
    image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    command: ["sh", "-c"]
    args:
      - |
        set -eu
        curl -fsSL --retry 3 -o /ext/pulsar-jms-all-6.0.11.jar https://repo1.maven.org/maven2/com/datastax/oss/pulsar-jms-all/6.0.11/pulsar-jms-all-6.0.11.jar
        echo "d4c744c8e5bdedb8f373ece959ebf2256128fc31248d5c2db909bce913ed7f3a  /ext/pulsar-jms-all-6.0.11.jar" | sha256sum -c -
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
    volumeMounts:
      - name: jms-ext
        mountPath: /ext
