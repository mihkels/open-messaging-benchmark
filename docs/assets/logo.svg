<!-- OMB mark: a latency percentile ladder (p50, p99, p99.9, max); the tail is the signal. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OMB">
  <rect width="32" height="32" rx="7" fill="#10141a"/>
  <rect x="6" y="7" width="9" height="3" rx="1.5" fill="#e7eaef"/>
  <rect x="6" y="12.5" width="13" height="3" rx="1.5" fill="#e7eaef"/>
  <rect x="6" y="18" width="16" height="3" rx="1.5" fill="#98a2b1"/>
  <rect x="6" y="23.5" width="20" height="3" rx="1.5" fill="#f0b13a"/>
</svg>
