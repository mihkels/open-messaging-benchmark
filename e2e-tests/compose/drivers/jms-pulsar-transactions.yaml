name: JMS-Pulsar-transactions
driverClass: io.openmessaging.benchmark.driver.jms.JMSBenchmarkDriver
connectionFactoryClassName: com.datastax.oss.pulsar.jms.PulsarConnectionFactory
connectionFactoryConfigurationParam: '{"brokerServiceUrl": "pulsar://pulsar:6650", "webServiceUrl": "http://pulsar:8080", "enableTransaction":"true", "producerConfig":{"blockIfQueueFull":"true"}}'
use20api: true
sendWithTransactions: true
delegateForAdminOperationsClassName: io.openmessaging.benchmark.driver.pulsar.PulsarBenchmarkDriver
client:
  serviceUrl: pulsar://pulsar:6650
  httpUrl: http://pulsar:8080
  clusterName: standalone
  namespacePrefix: public/default
  topicType: persistent
  persistence:
    ensembleSize: 1
    writeQuorum: 1
    ackQuorum: 1
    deduplicationEnabled: false
producer:
  blockIfQueueFull: true
  pendingQueueSize: 10000
