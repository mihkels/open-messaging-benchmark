# Apache ActiveMQ Artemis broker. Anonymous login matches the driver, which does not send credentials.
services:
  artemis:
    image: apache/artemis:2.57.0
    environment:
      ANONYMOUS_LOGIN: "true"
      JAVA_ARGS_APPEND: "-Xmx768m"
    healthcheck:
      test: ["CMD-SHELL", "/var/lib/artemis-instance/bin/artemis check node --silent --user artemis --password artemis > /dev/null 2>&1"]
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 10s

  stack-ready:
    depends_on:
      artemis:
        condition: service_healthy
