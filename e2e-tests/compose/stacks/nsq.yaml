# NSQ: nsqlookupd for discovery and one nsqd that registers itself under its service name.
services:
  nsqlookupd:
    image: nsqio/nsq:v1.3.0
    command: ["/nsqlookupd"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4161/ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  nsqd:
    image: nsqio/nsq:v1.3.0
    command: ["/nsqd", "--broadcast-address=nsqd", "--lookupd-tcp-address=nsqlookupd:4160", "--data-path=/tmp"]
    depends_on:
      nsqlookupd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4151/ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  stack-ready:
    depends_on:
      nsqd:
        condition: service_healthy
