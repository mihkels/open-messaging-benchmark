# Pravega standalone. The image is only published for linux/amd64 and runs emulated on Apple Silicon.
# HOST_IP is the address the segment store advertises to clients, so it must be the service name.
services:
  pravega:
    image: pravega/pravega:0.13.0
    platform: linux/amd64
    command: ["standalone"]
    environment:
      HOST_IP: pravega
      JAVA_OPTS: "-Xmx1g -XX:MaxDirectMemorySize=1g"
    healthcheck:
      # The controller REST API listens on 9091 in standalone mode; also require the segment store.
      test: ["CMD-SHELL", "curl -fsS http://localhost:9091/v1/scopes > /dev/null && nc -z localhost 12345"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s

  stack-ready:
    depends_on:
      pravega:
        condition: service_healthy
