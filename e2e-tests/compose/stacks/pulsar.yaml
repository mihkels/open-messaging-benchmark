# Apache Pulsar standalone (broker, BookKeeper and metadata store in one container).
# Transactions are enabled for the Pulsar JMS transaction regression case.
services:
  pulsar:
    image: apachepulsar/pulsar:4.0.6
    command: ["sh", "-c", "bin/apply-config-from-env.py conf/standalone.conf && exec bin/pulsar standalone -nfw -nss"]
    environment:
      PULSAR_MEM: "-Xms256m -Xmx1g -XX:MaxDirectMemorySize=512m"
      PULSAR_PREFIX_transactionCoordinatorEnabled: "true"
      PULSAR_PREFIX_systemTopicEnabled: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/admin/v2/brokers/health > /dev/null"]
      interval: 5s
      timeout: 20s
      retries: 40
      start_period: 20s

  stack-ready:
    depends_on:
      pulsar:
        condition: service_healthy
