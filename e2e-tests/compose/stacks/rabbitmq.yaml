# RabbitMQ single node. Classic, quorum and stream queues are all available.
services:
  rabbitmq:
    image: rabbitmq:4.1-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 20s
      retries: 30
      start_period: 10s

  stack-ready:
    depends_on:
      rabbitmq:
        condition: service_healthy
