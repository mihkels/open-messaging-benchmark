# Apache RocketMQ name server and one broker that advertises its service name to clients.
services:
  namesrv:
    image: apache/rocketmq:5.3.2
    command: ["sh", "mqnamesrv"]
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx512m -Xmn128m"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9876'"]
      interval: 3s
      timeout: 5s
      retries: 30

  broker:
    image: apache/rocketmq:5.3.2
    command: ["sh", "-c", "printf 'brokerClusterName=DefaultCluster\\nbrokerName=broker-a\\nbrokerId=0\\nbrokerIP1=broker\\nautoCreateTopicEnable=true\\nautoCreateSubscriptionGroup=true\\n' > /tmp/broker.conf && exec sh mqbroker -c /tmp/broker.conf"]
    environment:
      NAMESRV_ADDR: namesrv:9876
      JAVA_OPT_EXT: "-Xms512m -Xmx1g -Xmn256m"
    depends_on:
      namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n namesrv:9876 2>/dev/null | grep -q broker-a"]
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 10s

  stack-ready:
    depends_on:
      broker:
        condition: service_healthy
