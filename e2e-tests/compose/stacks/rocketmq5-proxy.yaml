# The RocketMQ 5 client uses its gRPC proxy rather than the legacy remoting protocol.
services:
  namesrv:
    environment:
      JAVA_OPT_EXT: "-Xms64m -Xmx256m -Xmn64m"

  broker:
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx512m -Xmn128m"

  proxy:
    image: apache/rocketmq:5.3.2
    command: ["sh", "mqproxy", "-n", "namesrv:9876"]
    environment:
      NAMESRV_ADDR: namesrv:9876
      JAVA_OPT_EXT: "-Xms64m -Xmx256m"
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8081'"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  stack-ready:
    depends_on:
      proxy:
        condition: service_healthy

  worker-1:
    environment:
      HEAP_OPTS: "-Xms64m -Xmx512m"
      SUPERVISOR_HEAP_OPTS: "-Xmx128m"
      OMB_DRIVER_JVM_OPTS: "-Xms64m -Xmx512m"

  worker-2:
    environment:
      HEAP_OPTS: "-Xms64m -Xmx512m"
      SUPERVISOR_HEAP_OPTS: "-Xmx128m"
      OMB_DRIVER_JVM_OPTS: "-Xms64m -Xmx512m"

  runner:
    environment:
      HEAP_OPTS: "-Xmx384m"
