# Two topics, each read by two independent subscriptions (every message must arrive twice).
name: e2e fan-out / 2 topics / 2 subscriptions / 100b

topics: 2
partitionsPerTopic: 1
keyDistributor: "NO_KEY"
messageSize: 100
payloadFile: "payload/payload-100b.data"
subscriptionsPerTopic: 2
consumerPerSubscription: 1
producersPerTopic: 1
producerRate: 200
consumerBacklogSizeGB: 0
warmupDurationMinutes: 0
testDurationMinutes: 1
