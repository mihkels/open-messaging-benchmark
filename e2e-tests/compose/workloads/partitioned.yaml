# One partitioned topic with keyed messages, two producers and two consumers per subscription.
name: e2e partitioned / 4 partitions / keyed / 2p-2c / 1Kb

topics: 1
partitionsPerTopic: 4
keyDistributor: "KEY_ROUND_ROBIN"
messageSize: 1024
payloadFile: "payload/payload-1Kb.data"
subscriptionsPerTopic: 1
consumerPerSubscription: 2
producersPerTopic: 2
producerRate: 200
consumerBacklogSizeGB: 0
warmupDurationMinutes: 0
testDurationMinutes: 1
