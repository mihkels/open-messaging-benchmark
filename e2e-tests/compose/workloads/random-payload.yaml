# Randomized 4Kb payloads (binary content, not compressible) through two consumers of one subscription.
name: e2e random payload / 1 topic / 4Kb

topics: 1
partitionsPerTopic: 1
keyDistributor: "RANDOM_NANO"
messageSize: 4096
useRandomizedPayloads: true
randomBytesRatio: 1.0
randomizedPayloadPoolSize: 100
subscriptionsPerTopic: 1
consumerPerSubscription: 2
producersPerTopic: 1
producerRate: 100
consumerBacklogSizeGB: 0
warmupDurationMinutes: 0
testDurationMinutes: 1
