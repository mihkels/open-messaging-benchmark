services:
  kafka:
    image: apache/kafka:4.4.0
    container_name: kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    ports:
      - "127.0.0.1:9092:9092"
    networks:
      - ombnet

  omb-worker-1:
    image: ${OMB_IMAGE:-openmessaging-benchmark:local}
    container_name: omb-worker-1
    environment:
      - HEAP_OPTS=-Xms512m -Xmx512m
    command: ["bash","-c","bin/benchmark-worker -p 8080"]
    ports:
      - "127.0.0.1:18081:8080"   # HTTP API and /metrics; loopback only, the API has no auth
    networks:
      - ombnet

  omb-worker-2:
    image: ${OMB_IMAGE:-openmessaging-benchmark:local}
    container_name: omb-worker-2
    environment:
      - HEAP_OPTS=-Xms512m -Xmx512m
    command: ["bash","-c","bin/benchmark-worker -p 8080"]
    ports:
      - "127.0.0.1:18082:8080"
    networks:
      - ombnet

  omb-driver:
    image: ${OMB_IMAGE:-openmessaging-benchmark:local}
    container_name: omb-driver
    environment:
      - HEAP_OPTS=-Xms512m -Xmx512m
    depends_on:
      - kafka
      - omb-worker-1
      - omb-worker-2
    volumes:
      - ./drivers:/drivers:ro
      - ./workloads:/workloads:ro
      - ./payload:/payload:ro
    # The image runs as a non-root user with a read-only /benchmark; results go to /results
    command:
      [
        "bash","-c",
        "echo 'Run the benchmark with:'; echo '  bin/benchmark --drivers /drivers/kafka.yaml --workers http://omb-worker-1:8080,http://omb-worker-2:8080 -o /results/result.json /workloads/simple.yaml'; exec sleep infinity"
      ]
    networks:
      - ombnet

networks:
  ombnet:
    driver: bridge