site_name: OpenMessaging Benchmark
site_description: Usage, driver, methodology and development documentation for the maintained OpenMessaging Benchmark fork.
site_url: https://mihkels.github.io/open-messaging-benchmark/
repo_url: https://github.com/mihkels/open-messaging-benchmark
repo_name: mihkels/open-messaging-benchmark
edit_uri: edit/main/docs/
copyright: >
  Licensed under the Apache License, Version 2.0 &middot;
  <a href="#__consent">Change cookie settings</a>

strict: true

exclude_docs: |
  requirements.txt
  demo/

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/site.js

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  # The first entry has no fixed scheme, so a new visitor gets the system setting; the toggle
  # cycles automatic, light and dark.
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

# Google Analytics loads only after the visitor accepts the cookie banner. Custom events
# (code copies, landing page clicks) are sent from assets/javascripts/site.js.
extra:
  analytics:
    provider: google
    property: G-3SRRECC5F8
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/thumb-up-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback!
        - icon: material/thumb-down-outline
          name: This page could be improved
          data: 0
          note: >
            Thanks for your feedback! Help us improve this page by
            <a href="https://github.com/mihkels/open-messaging-benchmark/issues/new?title=[Docs]+{title}&body=Page:+{url}" target="_blank" rel="noopener">opening an issue</a>.
  consent:
    title: Cookie consent
    description: >
      We use cookies to measure how the documentation is used, which pages help and
      where people get stuck. With your consent, you help us make the docs better.
    actions:
      - accept
      - reject
      - manage

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: getting-started/quickstart.md
      - Using your broker: getting-started/using-your-broker.md
      - Understanding your first run: getting-started/understanding-your-first-run.md
      - Distributed runs: getting-started/distributed-runs.md
  - Running benchmarks:
      - Workloads: guides/workloads.md
      - Payloads and keys: guides/payloads-and-keys.md
      - Workload generation: guides/workload-generation.md
      - Results: guides/results.md
      - Monitoring: guides/monitoring.md
      - Containers and Kubernetes: guides/containers-and-kubernetes.md
      - Troubleshooting: guides/troubleshooting.md
  - Drivers:
      - Supported drivers: drivers/index.md
      - Apache ActiveMQ Artemis: drivers/artemis.md
      - Apache BookKeeper (DistributedLog): drivers/bookkeeper.md
      - Apache Kafka: drivers/kafka.md
      - Kafka-on-Pulsar (KoP): drivers/kop.md
      - MQTT 5: drivers/mqtt5.md
      - JMS: drivers/jms.md
      - NATS JetStream: drivers/nats.md
      - NATS Streaming (legacy): drivers/nats-streaming.md
      - NSQ: drivers/nsq.md
      - Pravega: drivers/pravega.md
      - Apache Pulsar: drivers/pulsar.md
      - RabbitMQ: drivers/rabbitmq.md
      - Redis: drivers/redis.md
      - Apache RocketMQ: drivers/rocketmq.md
      - Apache RocketMQ 5 (gRPC): drivers/rocketmq5.md
  - Methodology:
      - Benchmark design: methodology/benchmark-design.md
      - Fair comparisons: methodology/fair-comparisons.md
      - Reproducibility: methodology/reproducibility.md
      - Latency and backlog: methodology/latency-and-backlog.md
  - Reference:
      - CLI: reference/cli.md
      - Workload schema: reference/workload-schema.md
      - Runtime and plugins: reference/runtime-and-plugins.md
      - Results schema: reference/results-schema.md
  - Driver development:
      - Architecture: development/architecture.md
      - Building the project: development/building-the-project.md
      - Implementing a driver: development/implementing-a-driver.md
      - Packaging a plugin: development/packaging-a-plugin.md
      - Testing a driver: development/testing-a-driver.md
      - Framework resource efficiency: development/framework-performance.md
      - Documentation: development/documentation.md
