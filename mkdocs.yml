site_name: OpenMessaging Benchmark
site_description: Usage, driver, methodology and development documentation for OpenMessaging Benchmark, a benchmark framework for messaging systems derived from the original OMB.
site_url: https://mihkels.github.io/open-messaging-benchmark/
repo_url: https://github.com/mihkels/open-messaging-benchmark
repo_name: mihkels/open-messaging-benchmark
edit_uri: edit/main/docs/
copyright: >
  Licensed under the Apache License, Version 2.0 &middot;
  <a href="#__consent">Change cookie settings</a>

strict: true

plugins:
  - search
  - blog
  # RSS 2.0 and JSON feeds for blog posts, dated from each post's front matter.
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date

exclude_docs: |
  requirements.in
  requirements.txt
  demo/
  development/adr/_template.md

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/site.js

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  # The first entry has no fixed scheme, so a new visitor gets the system setting; the toggle
  # cycles automatic, light and dark.
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

# Google Analytics loads only after the visitor accepts the cookie banner. Custom events
# (code copies, landing page clicks) are sent from assets/javascripts/site.js.
extra:
  analytics:
    provider: google
    property: G-3SRRECC5F8
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/thumb-up-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback!
        - icon: material/thumb-down-outline
          name: This page could be improved
          data: 0
          note: >
            Thanks for your feedback! Help us improve this page by
            <a href="https://github.com/mihkels/open-messaging-benchmark/issues/new?title=[Docs]+{title}&body=Page:+{url}" target="_blank" rel="noopener">opening an issue</a>.
  consent:
    title: Cookie consent
    description: >
      We use cookies to measure how the documentation is used, which pages help and
      where people get stuck. With your consent, you help us make the docs better.
    actions:
      - accept
      - reject
      - manage

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

